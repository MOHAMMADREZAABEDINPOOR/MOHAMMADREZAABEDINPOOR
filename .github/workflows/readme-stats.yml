name: Refresh README statistics

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-readme-stats.py
      - .github/workflows/readme-stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update-readme-stats.py
      - name: Commit changed badges
        run: |
          git add assets/readme/live-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh live README statistics'
          git push
